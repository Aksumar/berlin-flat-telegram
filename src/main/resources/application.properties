server.port=${METRICS_PORT:8080}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=berlin-flat-telegram
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.kafka.listener.auto-startup=false
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
app.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
app.topic=${KAFKA_TOPIC:berlin-flat-listings-v1}
app.group-id=${KAFKA_GROUP_ID:berlin-flat-telegram-v1}
app.bot-token=${TELEGRAM_BOT_TOKEN:}
app.chat-ids=${TELEGRAM_CHAT_IDS:}
app.geoapify-api-key=${GEOAPIFY_API_KEY:}
app.telegram-updates-enabled=${TELEGRAM_UPDATES_ENABLED:true}
spring.datasource.url=${SUBSCRIPTIONS_DATABASE_URL:jdbc:h2:file:./data/subscriptions}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Polling Telegram must not block delivery and housekeeping schedules.
spring.task.scheduling.pool.size=3
app.delivery-poll-delay-ms=${DELIVERY_POLL_DELAY_MS:50}
