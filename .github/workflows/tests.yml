name: Build, test and publish
on:
  push:
    branches-ignore: [telegram-state, delivery-state]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare reports
        run: mkdir -p reports dist
      - name: Unit and Kafka integration tests
        run: ./gradlew test integrationTest bootJar --no-daemon 2>&1 | tee reports/tests.log
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: service-test:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package artifacts
        run: |
          docker save service-test:ci | gzip > dist/image-linux-amd64.tar.gz
          git archive --format=tar.gz HEAD > dist/source.tar.gz
          docker image inspect service-test:ci > dist/image-inspect.json
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          cd dist
          sha256sum image-linux-amd64.tar.gz source.tar.gz image-inspect.json commit.txt > SHA256SUMS
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berlin-flat-telegram-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$GITHUB_REF_NAME")
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g' | cut -c1-110)
            tags+=("branch-$branch")
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then tags+=(latest); fi
          fi
          for tag in "${tags[@]}"; do
            docker tag service-test:ci "$image:$tag"
            docker push "$image:$tag" 2>&1 | tee -a reports/publish.log
            printf '%s\n' "$image:$tag" >> reports/published-images.txt
          done
          cat reports/published-images.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berlin-flat-telegram-reports-${{ github.sha }}
          path: |
            reports/
            build/reports/tests/
            build/test-results/
          retention-days: 14
