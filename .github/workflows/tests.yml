name: Build, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      export_archives:
        description: Export Docker image and source archives
        type: boolean
        default: false
env:
  # Temporary: artifact storage quota is exhausted.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  UPLOAD_REPORTS: "false"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare reports
        run: mkdir -p reports
      - name: Unit and Kafka integration tests
        run: ./gradlew test integrationTest bootJar --no-daemon 2>&1 | tee reports/tests.log
      - name: Prepare image context
        run: |
          mkdir -p image-context
          cp build/libs/app.jar image-context/app.jar
          cp Dockerfile.ci image-context/Dockerfile
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Verify image build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64
          tags: service-test:ci
          cache-from: type=gha,scope=telegram-runtime
          cache-to: type=gha,scope=telegram-runtime,mode=max
      - name: Upload tested JAR and image recipe
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-image-context-${{ github.run_id }}
          path: image-context/
          overwrite: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload test reports
        if: always() && env.UPLOAD_REPORTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: berlin-flat-telegram-reports-${{ github.sha }}
          path: |
            reports/
            build/reports/tests/
            build/test-results/
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag' || inputs.export_archives == true
      - uses: actions/download-artifact@v4
        with:
          name: telegram-image-context-${{ github.run_id }}
          path: image-context
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$GITHUB_REF_NAME")
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g' | cut -c1-110)
            tags+=("branch-$branch")
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then tags+=(latest); fi
          fi
          mkdir -p reports
          for tag in "${tags[@]}"; do
            printf '%s\n' "$image:$tag" >> reports/image-tags.txt
          done
          {
            echo 'tags<<IMAGE_TAGS'
            cat reports/image-tags.txt
            echo IMAGE_TAGS
            echo "reference=$image:sha-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish image from tested JAR
        uses: docker/build-push-action@v6
        with:
          context: image-context
          push: true
          load: ${{ github.ref_type == 'tag' || inputs.export_archives == true }}
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=telegram-runtime
          cache-to: type=gha,scope=telegram-runtime,mode=max
      - name: Record published images
        run: |
          cp reports/image-tags.txt reports/published-images.txt
          cat reports/published-images.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Package archives
        if: github.ref_type == 'tag' || inputs.export_archives == true
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p dist
          docker save "$IMAGE_REFERENCE" | gzip > dist/image-linux-amd64.tar.gz
          git archive --format=tar.gz HEAD > dist/source.tar.gz
          docker image inspect "$IMAGE_REFERENCE" > dist/image-inspect.json
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          cd dist
          sha256sum image-linux-amd64.tar.gz source.tar.gz image-inspect.json commit.txt > SHA256SUMS
      - name: Upload archives
        if: github.ref_type == 'tag' || inputs.export_archives == true
        uses: actions/upload-artifact@v4
        with:
          name: berlin-flat-telegram-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload publication reports
        if: always() && env.UPLOAD_REPORTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: berlin-flat-telegram-publication-${{ github.sha }}
          path: reports/
          retention-days: 14
